<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PPL · HIT</title>
<style>
  :root {
    --bg: #000000;
    --surface: #1a1a1c;
    --surface-2: #242427;
    --separator: #2e2e31;
    --text: #f2f2f2;
    --text-dim: #8a8a8e;
    --text-faint: #5c5c60;
    --accent: #a6ff00;
    --accent-dim: rgba(166, 255, 0, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --tap: 44px;
    font-size: 17px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: contain;
  }

  body {
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  /* ---------- Sticky header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    border-bottom: 0.5px solid var(--separator);
  }

  .titlebar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .titlebar h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .titlebar .sub {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  /* ---------- Segmented control (Apple style) ---------- */
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 2px;
    position: relative;
  }

  .segmented button {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 9px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease;
    min-height: 36px;
  }

  .segmented button.active {
    background: var(--accent);
    color: #0a0a0a;
    box-shadow: 0 1px 6px rgba(166, 255, 0, 0.25);
  }

  /* ---------- Progress ---------- */
  .progress-wrap {
    padding: 12px 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* ---------- Content ---------- */
  main { padding: 8px 16px 0; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 26px 4px 10px;
  }

  .section-label:first-child { margin-top: 16px; }

  .block-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    padding: 14px 16px 4px;
    text-transform: none;
  }

  /* ---------- Agenda rows / cards ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--separator);
  }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 15px 16px;
    min-height: var(--tap);
    cursor: pointer;
    user-select: none;
  }

  .row + .row { border-top: 0.5px solid var(--separator); }

  /* ---------- Checkbox ---------- */
  .check {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .check svg {
    width: 14px;
    height: 14px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .row.checked .check,
  .set-row.checked .check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .row.checked .check svg,
  .set-row.checked .check svg { opacity: 1; transform: scale(1); }
  .row:active .check, .set-row:active .check { transform: scale(0.88); }

  /* ---------- Row text ---------- */
  .row-body { flex: 1; min-width: 0; }

  .row-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    transition: color 0.2s ease;
  }

  .row.checked .row-title {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    white-space: nowrap;
  }

  .badge.iso {
    background: var(--surface-2);
    color: var(--text-dim);
  }

  .row.checked .badge { opacity: 0.4; }

  .row-dur {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }
  .row.checked .row-dur { color: var(--text-faint); }

  .meta {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  .meta .rest { color: var(--text-dim); font-weight: 500; }
  .row.checked .meta { color: var(--text-faint); }

  .note {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-dim);
  }

  .row.checked .note { opacity: 0.45; }

  /* Multi-set: stack the title row, then the set checkboxes */
  .exercise { padding: 15px 16px; }
  .exercise + .exercise { border-top: 0.5px solid var(--separator); }

  .ex-head { margin-bottom: 12px; }

  .sets {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    cursor: pointer;
    user-select: none;
    min-height: 40px;
  }
  .set-row + .set-row { border-top: 0.5px solid var(--separator); }
  .row + .set-row { border-top: 0.5px solid var(--separator); }
  .card > .set-row { padding-left: 16px; padding-right: 16px; }

  .set-row .check { width: 23px; height: 23px; margin-top: 0; }
  .set-row .check svg { width: 12px; height: 12px; }

  .set-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .set-row.checked .set-label {
    color: var(--text-faint);
    text-decoration: line-through;
  }
  .set-reps {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .set-row.checked .set-reps { color: var(--text-faint); }

  /* ---------- Reset ---------- */
  .reset-wrap { padding: 16px 16px 0; text-align: center; }
  .reset {
    appearance: none;
    border: 0.5px solid var(--separator);
    background: var(--surface);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .reset:active { background: var(--surface-2); }
  .reset.armed { color: #ff453a; border-color: #ff453a; }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 14px 24px 0;
    line-height: 1.5;
  }

  /* ---------- Done banner ---------- */
  .done-banner {
    margin: 18px 16px 0;
    padding: 16px;
    border-radius: var(--radius);
    background: var(--accent-dim);
    border: 0.5px solid rgba(166, 255, 0, 0.3);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.01em;
    display: none;
  }
  .done-banner.show { display: block; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease; }

  /* ---------- Rest Timer (bottom sheet) ---------- */
  .timer-overlay {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    display: none;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .timer-overlay.show { display: block; }

  .timer-sheet {
    pointer-events: auto;
    background: rgba(26, 26, 28, 0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 0.5px solid var(--separator);
    border-radius: 20px;
    padding: 12px 12px 14px 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    animation: sheet-up 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }

  @keyframes sheet-up {
    from { transform: translateY(130%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .timer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .timer-readout {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .timer-time {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }
  .timer-sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .timer-close {
    flex: none;
    width: var(--tap);
    height: var(--tap);
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .timer-close:active { background: var(--separator); }
  .timer-close svg { width: 18px; height: 18px; }

  .timer-bar {
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 11px;
  }
  .timer-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 3px;
  }

  .up-next {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
    margin-top: 10px;
    min-height: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Landscape: wider side gutters + notch clearance ---------- */
  @media (orientation: landscape) and (max-height: 520px) {
    header {
      padding-left: max(64px, calc(env(safe-area-inset-left) + 16px));
      padding-right: max(64px, calc(env(safe-area-inset-right) + 16px));
    }
    main {
      padding-left: max(64px, calc(env(safe-area-inset-left) + 16px));
      padding-right: max(64px, calc(env(safe-area-inset-right) + 16px));
    }
    .reset-wrap {
      padding-left: max(64px, calc(env(safe-area-inset-left) + 16px));
      padding-right: max(64px, calc(env(safe-area-inset-right) + 16px));
    }
    .timer-overlay {
      padding-left: max(48px, calc(env(safe-area-inset-left) + 12px));
      padding-right: max(48px, calc(env(safe-area-inset-right) + 12px));
    }
  }

</style>
</head>
<body>
  <header>
    <div class="segmented" role="tablist">
      <button data-day="push" class="active" role="tab">Push</button>
      <button data-day="pull" role="tab">Pull</button>
      <button data-day="legs" role="tab">Legs</button>
      <button data-day="abs" role="tab">Core</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    </div>
  </header>

  <div class="done-banner" id="doneBanner">Workout complete. Great work!</div>

  <div class="reset-wrap">
    <button class="reset" id="resetBtn">Reset Workout</button>
  </div>


  <main id="agenda"></main>

  <div class="timer-overlay" id="timerOverlay">
    <div class="timer-sheet">
      <div class="timer-head">
        <div class="timer-readout">
          <div class="timer-time" id="timerTime">0:00</div>
          <div class="timer-sub" id="timerSub">Remaining</div>
        </div>
        <button class="timer-close" id="timerClose" aria-label="Cancel rest timer">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="timer-bar"><div class="timer-bar-fill" id="timerBarFill"></div></div>

      <div class="up-next" id="upNext"></div>
    </div>
  </div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0a0a0a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const PLAN = {
  push: {
    title: "Push",
    warmup: "Light dynamic movement — arm swings and shoulder circles to raise core temperature.",
    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first press. These don't count as working sets.",
    exercises: [
      { name: "Chest Press", variant: "Machine or Barbell Bench", type: "compound", block: "Machine", sets: 3, reps: "8–12", rest: "75s", note: "Lower under control to mid-chest. Keep shoulder blades pulled back and down. Drive up without bouncing. Stop 1 rep shy on sets 1–2, true failure on the last set." },
      { name: "Incline Dumbbell Press", type: "compound", block: "Free Weights", sets: 3, reps: "8–12", rest: "60s", note: "Set the bench around 30°. Lower until you feel a stretch across the upper chest. Press the dumbbells up and slightly together. Failure on the last set; down-set if reps drop below range." },
      { name: "Overhead Press", variant: "Machine or Dumbbell", type: "compound", block: "Free Weights", sets: 3, reps: "8–12", rest: "60s", note: "Brace your core and squeeze your glutes — don't lean back. Press straight overhead, not forward. Full lockout at the top. Failure on the last set." },
      { name: "Dumbbell Lateral Raise", type: "iso", block: "Free Weights", sets: 3, reps: "12–20", rest: "45s", note: "Lead with the elbow, raise to shoulder height. Keep a soft elbow and no swinging or body english. Lower slowly. Failure on every set." },
      { name: "Pec Deck or Cable Fly", type: "iso", block: "Pec deck", sets: 2, reps: "12–15", rest: "60s", note: "Keep a slight bend in the elbows throughout. Lead with the elbows, not the hands. Squeeze hard at the midline, control the stretch back. Take both sets to failure." },
      { name: "Triceps Pushdown", type: "iso", block: "Cable station", sets: 3, reps: "10–15", rest: "45s", note: "Pin your elbows to your sides and keep them there. Fully extend at the bottom, control the return. Failure on every set." },
      { name: "Overhead Cable Extension", type: "iso", block: "Cable station", sets: 2, reps: "10–15", rest: "45s", note: "Let the elbows travel behind your head for a deep stretch. Keep upper arms fixed, extend fully. Failure on both sets." }
    ]
  },
  pull: {
    title: "Pull",
    warmup: "Light dynamic movement — arm swings, scapular pull-ups.",
    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first pull. These don't count as working sets.",
    exercises: [
      { name: "Lat Pulldown or Pull-Up", type: "compound", block: "Pulldown / row station", sets: 3, reps: "8–12", rest: "75s", note: "Start from a full stretch overhead. Drive your elbows down and back, not your hands. Pull to the upper chest and control the return. Stop 1 rep shy on sets 1–2, failure on the last." },
      { name: "Seated Cable Row", type: "compound", block: "Pulldown / row station", sets: 3, reps: "8–12", rest: "60s", note: "Keep your torso upright — don't rock for momentum. Pull to your stomach, squeeze the shoulder blades together. Control the stretch forward. Failure on the last set." },
      { name: "Chest-Supported Row", variant: "or Barbell Row", type: "compound", block: "Supported row", sets: 3, reps: "10–12", rest: "60s", note: "Let the weight stretch your back at the bottom. Row toward your hips, leading with the elbows. Pause and squeeze at the top. Stop 1 rep shy early, failure on the last set." },
      { name: "Face Pull or Reverse Pec Deck", type: "iso", block: "Rear delts, biceps + traps", sets: 3, reps: "15–20", rest: "45s", note: "Keep it light and controlled. Pull toward your forehead with elbows high. Squeeze the rear delts, don't shrug. Failure on every set." },
      { name: "EZ-Bar or Cable Curl", type: "iso", block: "Rear delts, biceps + traps", sets: 3, reps: "10–12", rest: "45s", note: "Keep your elbows pinned at your sides. Curl without swinging your back. Full squeeze at the top, controlled lowering. Failure on every set." },
      { name: "Hammer Curl", variant: "Dumbbell or Rope Cable", type: "iso", block: "Rear delts, biceps + traps", sets: 3, reps: "10–12", rest: "45s", note: "Neutral grip, thumbs up throughout — this is the brachioradialis builder. Elbows pinned, no swinging. Control the lowering. Failure on every set." },
      { name: "Dumbbell Shrug", variant: "or Trap Bar", type: "iso", block: "Rear delts, biceps + traps", sets: 3, reps: "10–15", rest: "45s", note: "Straight up and down — no rolling the shoulders. Pause and squeeze at the top, lower to a full stretch. If your grip fails before your traps do, that's the limiter, not the muscle. Failure on every set." }
    ]
  },
  legs: {

    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first squat. These don't count as working sets.",
    exercises: [
      { name: "Squat or Hack Squat", type: "compound", block: "Rack / free-weight zone", sets: 3, reps: "8–12", rest: "90s", note: "Brace your core and keep your chest up. Push your knees out, descend to at least parallel. Drive through mid-foot. Stay 1–2 reps shy — never to true failure under load. Use the rack safeties." },
      { name: "Romanian Deadlift", type: "compound", block: "Rack / free-weight zone", sets: 3, reps: "10–12", rest: "75s", note: "Soft knees, push your hips back. Keep a flat back and the bar close to your legs. Feel the hamstring stretch, then drive your hips forward. Stay 1–2 reps shy; stop if your back rounds." },
      { name: "Leg Press", type: "compound", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Feet mid-platform, knees tracking over your toes. Lower until your knees reach ~90° without your lower back rounding. Don't lock out hard at the top. Failure on the last set." },
      { name: "Leg Extension", type: "iso", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Pause and squeeze the quads at the top. Lower under control, don't let it slam. Failure on every set; down-set as you fatigue." },
      { name: "Seated or Lying Leg Curl", type: "iso", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Keep your hips down on the pad. Curl all the way, squeeze at the bottom. Control the negative — don't let it snap back. Failure on every set." },
      { name: "Calf Raise", variant: "Machine or Standing", type: "iso", block: "Machine zone", sets: 3, reps: "15–20", rest: "45s", note: "Drop into a deep stretch at the bottom, pause briefly. Rise to full extension on the toes. No bouncing through the reps. Failure on every set." }

  abs: {
    title: "Core",
    sectionLabel: "Exercises",
    warmup: "Cat-cow and a few dead bugs — wake up the brace before you load it.",

    ramps: [],
    cooldownDur: "2 min",
    cooldownNote: "Child's pose and a gentle cobra to decompress after the flexion work.",
    exercises: [
      { name: "Crunch", variant: "Bodyweight", type: "iso", block: "Floor", sets: 2, reps: "8–15", rest: "45s", note: "Curl the ribs toward the hips — spine flexes, hips don't. Pause at the top, lower slowly. Progress by moving the arms: at your sides → crossed on chest → behind the head → extended overhead. Failure on both sets." },
      { name: "Lying Leg Raise", variant: "Floor or Bench", type: "iso", block: "Floor", sets: 2, reps: "8–15", rest: "45s", note: "Press the low back into the floor and keep it there. Raise until the hips lift slightly off the ground, lower without letting the feet touch down. Progress by straightening the legs: tuck → single leg straight → both straight. Failure on both sets." },
      { name: "Hollow Body", type: "iso", unit: "hold", block: "Floor", sets: 2, reps: "20–40s", rest: "45s", note: "Low back pinned flat, ribs down, shoulder blades just off the floor. Progress by extending the levers: knees tucked → one leg out → both legs out → arms overhead. Hold until the low back starts to lift, then stop." },
      { name: "Bicycle Crunch", type: "iso", unit: "reps each side", block: "Floor", sets: 2, reps: "10–16", rest: "45s", note: "Slow and deliberate — rotate from the ribcage, not the elbows. Fully extend the straight leg and keep it low. Pause at each end. Failure on both sets." }
    ]
  }
};

const DEFAULT_RAMPS = [
  { label: "Ramp-Up Set 1", right: "≈50%" },
  { label: "Ramp-Up Set 2", right: "≈75%" }
];

const STORAGE_KEY = "ppl-hit-v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { state = {}; }

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let currentDay = "push";

function itemKey(day, id) { return day + ":" + id; }
function isChecked(day, id) { return !!state[itemKey(day, id)]; }
function setChecked(day, id, val) {
  state[itemKey(day, id)] = val;
  if (!val) delete state[itemKey(day, id)];
  save();
}

function buildIds(day) {
  // Returns a flat list of every checkable id for the day (for progress)
  const ids = ["warmup_dynamic"];
  const ramps = PLAN[day].ramps || DEFAULT_RAMPS;
  ramps.forEach((r, idx) => ids.push("warmup_ramp" + (idx + 1)));
  PLAN[day].exercises.forEach((ex, i) => {
    const lastEx = PLAN[day].exercises.length - 1;
    for (let s = 1; s <= ex.sets; s++) {
      ids.push("ex" + i + "_set" + s);
      const finalRestOfDay = (i === lastEx) && (s === ex.sets);
      if (!finalRestOfDay) ids.push("ex" + i + "_rest" + s);
    }
  });
  ids.push("cooldown");
  return ids;
}

function checkSvgEl() {
  const span = document.createElement("span");
  span.className = "check";
  span.innerHTML = CHECK_SVG;
  return span;
}

function makeSimpleRow(day, id, title, duration, note) {
  const row = document.createElement("div");
  row.className = "row" + (isChecked(day, id) ? " checked" : "");
  row.appendChild(checkSvgEl());
  const body = document.createElement("div");
  body.className = "row-body";
  const t = document.createElement("div");
  t.className = "row-title";
  t.appendChild(document.createTextNode(title));
  if (duration) {
    const d = document.createElement("span");
    d.className = "row-dur";
    d.textContent = duration;
    t.appendChild(d);
  }
  body.appendChild(t);
  if (note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; body.appendChild(n); }
  row.appendChild(body);
  row.addEventListener("click", () => {
    const now = !isChecked(day, id);
    setChecked(day, id, now);
    row.classList.toggle("checked", now);
    const c = row.querySelector(".check");
    if (now) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    updateProgress();
  });
  return row;
}

function makeSetRow(day, id, label, right, restSpec) {
  const sr = document.createElement("div");
  sr.className = "set-row" + (isChecked(day, id) ? " checked" : "");
  sr.appendChild(checkSvgEl());
  const lab = document.createElement("span");
  lab.className = "set-label";
  lab.textContent = label;
  sr.appendChild(lab);
  const r = document.createElement("span");
  r.className = "set-reps";
  r.textContent = right;
  sr.appendChild(r);
  sr.addEventListener("click", () => {
    const now = !isChecked(day, id);
    setChecked(day, id, now);
    sr.classList.toggle("checked", now);
    const c = sr.querySelector(".check");
    if (now) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    updateProgress();
    if (now && restSpec && window.openTimer) window.openTimer(restSpec);
  });
  return sr;
}

// Parse a rest string like "45s", "60–75s", "75–90s" into {low, high} seconds
function parseRest(restStr) {
  const nums = (restStr.match(/\d+/g) || []).map(Number);
  if (nums.length === 0) return { low: 60, high: 60 };
  if (nums.length === 1) return { low: nums[0], high: nums[0] };
  return { low: nums[0], high: nums[1] };
}

function render() {
  const day = currentDay;
  const plan = PLAN[day];
  const main = document.getElementById("agenda");
  main.innerHTML = "";

  // WARM-UP
  const wlabel = document.createElement("div");
  wlabel.className = "section-label";
  wlabel.textContent = "Warm-up";
  main.appendChild(wlabel);
  const wcard = document.createElement("div");
  wcard.className = "card";
  wcard.appendChild(makeSimpleRow(day, "warmup_dynamic", "Dynamic Warm-Up", plan.warmupDur || "2 min", plan.warmup));
  const ramps = plan.ramps || DEFAULT_RAMPS;
  ramps.forEach((r, idx) => {
    wcard.appendChild(makeSetRow(day, "warmup_ramp" + (idx + 1), r.label, r.right));
  });
  main.appendChild(wcard);

  // EXERCISES
  const elabel = document.createElement("div");
  elabel.className = "section-label";
  elabel.textContent = plan.sectionLabel || "Lifts";
  main.appendChild(elabel);
  const ecard = document.createElement("div");
  ecard.className = "card";

  let lastBlock = null;
  plan.exercises.forEach((ex, i) => {
    if (ex.block && ex.block !== lastBlock) {
      const bl = document.createElement("div");
      bl.className = "block-label";
      bl.textContent = ex.block;
      ecard.appendChild(bl);
      lastBlock = ex.block;
    }
    const block = document.createElement("div");
    block.className = "exercise";

    const head = document.createElement("div");
    head.className = "ex-head";
    const t = document.createElement("div");
    t.className = "row-title";
    t.appendChild(document.createTextNode(ex.name));
    const badge = document.createElement("span");
    badge.className = "badge" + (ex.type === "iso" ? " iso" : "");
    badge.textContent = ex.type === "iso" ? "Isolation" : "Compound";
    t.appendChild(badge);
    head.appendChild(t);

    const meta = document.createElement("div");
    meta.className = "meta";
    const variant = ex.variant ? ex.variant + " · " : "";
    meta.innerHTML = variant + ex.sets + (ex.sets > 1 ? " sets" : " set") + " × " + ex.reps + " " + (ex.unit || "reps");
    head.appendChild(meta);

    const note = document.createElement("div");
    note.className = "note";
    note.textContent = ex.note;
    head.appendChild(note);

    block.appendChild(head);

    const sets = document.createElement("div");
    sets.className = "sets";
    const lastEx = plan.exercises.length - 1;
    for (let s = 1; s <= ex.sets; s++) {
      sets.appendChild(makeSetRow(day, "ex" + i + "_set" + s, "Set " + s, ex.reps + " " + (ex.unit || "reps")));
      const finalRestOfDay = (i === lastEx) && (s === ex.sets);
      if (!finalRestOfDay) {
        let nextReps, nextName, nextUnit;
        if (s < ex.sets) { nextReps = ex.reps; nextName = ex.name; nextUnit = ex.unit || "reps"; }
        else { const nx = plan.exercises[i + 1]; nextReps = nx.reps; nextName = nx.name; nextUnit = nx.unit || "reps"; }
        const unitLabel = nextUnit.charAt(0).toUpperCase() + nextUnit.slice(1);
        const upNext = nextReps + " " + unitLabel + " of " + nextName;
        sets.appendChild(makeSetRow(day, "ex" + i + "_rest" + s, "Rest", ex.rest, { upNext: upNext, rest: ex.rest }));
      }
    }
    block.appendChild(sets);
    ecard.appendChild(block);
  });
  main.appendChild(ecard);

  // COOLDOWN
  const clabel = document.createElement("div");
  clabel.className = "section-label";
  clabel.textContent = "Cooldown";
  main.appendChild(clabel);
  const ccard = document.createElement("div");
  ccard.className = "card";
  ccard.appendChild(makeSimpleRow(day, "cooldown", "Cooldown stretch", plan.cooldownDur || "8 min", plan.cooldownNote || "Static stretches for the muscles you trained. Slow it down and breathe."));
  main.appendChild(ccard);

  updateProgress();
}

function updateProgress() {
  const ids = buildIds(currentDay);
  const total = ids.length;
  const done = ids.filter(id => isChecked(currentDay, id)).length;
  document.getElementById("progFill").style.width = (total ? (done / total * 100) : 0) + "%";
  document.getElementById("doneBanner").classList.toggle("show", done === total && total > 0);
}

// Tabs
document.querySelectorAll(".segmented button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".segmented button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDay = btn.dataset.day;
    if (typeof disarmReset === "function") disarmReset();
    render();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  });
});

// Reset
// Reset (two-tap confirm — works inside sandboxed iframes where confirm() is blocked)
const resetBtn = document.getElementById("resetBtn");
let resetArmed = false;
let resetTimer = null;
function disarmReset() {
  resetArmed = false;
  resetBtn.textContent = "Reset Workout";
  resetBtn.classList.remove("armed");
  if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
}
resetBtn.addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true;
    resetBtn.textContent = "Delete all progress";
    resetBtn.classList.add("armed");
    resetTimer = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  buildIds(currentDay).forEach(id => setChecked(currentDay, id, false));
  render();
});

/* ---------------- Rest Timer ---------------- */
(function () {
  const overlay   = document.getElementById("timerOverlay");
  const closeBtn  = document.getElementById("timerClose");
  const timeEl    = document.getElementById("timerTime");
  const subEl     = document.getElementById("timerSub");
  const barFill   = document.getElementById("timerBarFill");
  const upNextEl  = document.getElementById("upNext");

  const TIMER_KEY = "ppl-hit-timer";
  const TICK_MS   = 200;   // smooth bar; display still ticks at 1s
  const HOLD_MS   = 1400;  // how long "Done" stays before auto-dismiss

  let totalSec  = 0;
  let endTime   = 0;
  let running   = false;
  let intervalId = null;
  let closeToken = 0;      // invalidates a pending auto-dismiss when a new timer starts

  /* ----- audio -----
     iOS suspends an AudioContext that has been idle, and a suspended context
     can only be resumed from a user gesture. Firing the chime from a setInterval
     callback 60s later therefore hits a dead context and silently does nothing.
     Fix: schedule the chime on the Web Audio clock at the moment the rest starts
     (while we still have the tap), and hold the context open with an inaudible
     keep-alive tone so iOS doesn't idle it out. The audio thread plays the
     scheduled sound whether or not JS is running at that instant. ----- */
  let audioCtx  = null;
  let scheduled = [];       // live nodes, torn down if the rest is cancelled
  let keepAlive = null;
  let chimeArmed = false;   // true once a chime is queued on the audio clock

  function unlockAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }

  // Which variant the rest timer uses. 1 = Swell, 2 = Bloom, 3 = Rise.
  const ACTIVE_CHIME = 2;

  // Shared voice builder: one sine partial with a fade-in/fade-out envelope.
  function voice(dest, t, hz, peak, attack, release, detune) {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(hz, t);
    osc.detune.setValueAtTime(detune || 0, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + release);
    osc.connect(gain);
    gain.connect(dest);
    osc.start(t);
    osc.stop(t + release + 0.05);
    scheduled.push(osc);
  }

  // Master chain: lowpass -> volume -> limiter -> out.
  // The limiter lets the volume go well past unity without the partials
  // summing into hard clipping (variant 2 stacks six voices).
  const CHIME_VOL = 0.40;          // tuned by ear; 0..1
  const VOL_MAX   = 6;             // multiplier at CHIME_VOL = 1

  function lowpass(hz) {
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -8;
    comp.knee.value = 6;
    comp.ratio.value = 12;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    comp.connect(audioCtx.destination);

    const master = audioCtx.createGain();
    master.gain.value = CHIME_VOL * VOL_MAX;
    master.connect(comp);

    const f = audioCtx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = hz;
    f.Q.value = 0.4;
    f.connect(master);
    return f;
  }

  const CHIMES = {
    // 1 — Swell: two soft tones a fifth apart, detuned pairs for warmth. Current sound.
    1: function (t0) {
      const f = lowpass(1200);
      [{ at: 0, hz: 352 }, { at: 0.46, hz: 528 }].forEach(step => {
        [0, 1.5].forEach(d => voice(f, t0 + step.at, step.hz, 0.22, 0.12, 0.85, d));
      });
    },
    // 2 — Bloom: one soft chord that fades up and hangs. Slowest, most ambient.
    2: function (t0) {
      const f = lowpass(1500);
      [{ hz: 396, g: 0.20 }, { hz: 594, g: 0.13 }, { hz: 792, g: 0.08 }].forEach(v => {
        voice(f, t0, v.hz, v.g, 0.20, 1.60, 0);
        voice(f, t0, v.hz, v.g * 0.5, 0.20, 1.60, 2.5);
      });
    },
    // 3 — Rise: three short ascending pulses. Most noticeable, still no attack click.
    3: function (t0) {
      const f = lowpass(1700);
      [396, 528, 660].forEach((hz, i) => {
        voice(f, t0 + i * 0.20, hz, 0.24, 0.05, 0.42, 0);
        voice(f, t0 + i * 0.20, hz, 0.10, 0.05, 0.42, 2);
      });
    }
  };

  function playChime(which) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const fn = CHIMES[which] || CHIMES[1];
    try { fn(audioCtx.currentTime); } catch (e) {}
  }

  // Inaudible tone that runs for the length of the rest. Without an active
  // source iOS treats the context as idle and suspends it before the chime.
  function startKeepAlive(secs) {
    if (!audioCtx) return;
    try {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.0001;
      osc.type = "sine";
      osc.frequency.value = 20;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + secs + 3);
      keepAlive = osc;
    } catch (e) {}
  }

  function cancelAudio() {
    scheduled.forEach(n => {
      try { n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
    scheduled = [];
    if (keepAlive) {
      try { keepAlive.stop(); } catch (e) {}
      try { keepAlive.disconnect(); } catch (e) {}
      keepAlive = null;
    }
    chimeArmed = false;
  }

  // Queue the chime on the audio clock for `secs` from now. Called inside the
  // tap that starts the rest, which is what makes it legal on iOS.
  function armChime(secs) {
    unlockAudio();
    if (!audioCtx) return;
    const arm = () => {
      if (audioCtx.state !== "running") return;
      try {
        startKeepAlive(secs);
        (CHIMES[ACTIVE_CHIME] || CHIMES[1])(audioCtx.currentTime + secs);
        chimeArmed = true;
      } catch (e) {}
    };
    if (audioCtx.state === "running") arm();
    else audioCtx.resume().then(arm).catch(() => {});
  }


  /* ----- persistence so the countdown survives lock / suspend ----- */
  function persist(upNext) {
    try {
      localStorage.setItem(TIMER_KEY, JSON.stringify({ endTime: endTime, totalSec: totalSec, upNext: upNext || "" }));
    } catch (e) {}
  }
  function clearPersist() {
    try { localStorage.removeItem(TIMER_KEY); } catch (e) {}
  }

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  // Everything is derived from the wall clock, so a suspended tab resyncs on return.
  function paint() {
    const msLeft = Math.max(0, endTime - Date.now());
    timeEl.textContent = fmt(Math.ceil(msLeft / 1000));
    const frac = totalSec > 0 ? 1 - (msLeft / (totalSec * 1000)) : 1;
    barFill.style.width = (Math.min(1, Math.max(0, frac)) * 100).toFixed(2) + "%";
    return msLeft;
  }

  function stopTick() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
  }
  function startTick() {
    stopTick();
    intervalId = setInterval(tick, TICK_MS);
  }

  function tick() {
    if (!running) return;
    if (paint() <= 0) {
      if (document.hidden) hardClose();   // expired while away — just clear it
      else finish();
    }
  }

  function finish() {
    running = false;
    stopTick();
    clearPersist();
    timeEl.textContent = "0:00";
    barFill.style.width = "100%";
    subEl.textContent = "Done";
    if (!chimeArmed) playChime(ACTIVE_CHIME);  // fallback if scheduling was refused
    scheduled = [];        // let the tail ring out; don't tear it down on close
    chimeArmed = false;
    const token = ++closeToken;
    setTimeout(() => { if (token === closeToken) hardClose(); }, HOLD_MS);
  }

  function hardClose() {
    cancelAudio();
    running = false;
    stopTick();
    clearPersist();
    closeToken++;
    overlay.classList.remove("show");
  }

  // Starting a new rest replaces whatever is on screen, mid-countdown or mid-"Done".
  function openTimer(spec) {
    const secs = parseRest(spec.rest).low;
    closeToken++;                      // cancel any pending auto-dismiss
    cancelAudio();                     // drop any chime queued by a previous rest
    armChime(secs);                    // rides the tap that checked the box
    stopTick();
    totalSec = secs;
    endTime  = Date.now() + secs * 1000;
    running  = true;
    upNextEl.textContent = spec.upNext ? "Up Next: " + spec.upNext : "";
    subEl.textContent = "Remaining";
    persist(spec.upNext);
    if (!overlay.classList.contains("show")) overlay.classList.add("show");
    paint();
    startTick();
  }
  window.openTimer = openTimer;

  // Resync the moment the app comes back into view.
  function resync() {
    if (!running || document.hidden) return;
    if (paint() <= 0) hardClose();
  }
  document.addEventListener("visibilitychange", resync);
  window.addEventListener("pageshow", resync);

  // Restore an in-flight rest after a full app suspend.
  (function restore() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(TIMER_KEY)); } catch (e) {}
    if (!saved || !saved.endTime) return;
    if (Date.now() >= saved.endTime) { clearPersist(); return; }
    totalSec = saved.totalSec;
    endTime  = saved.endTime;
    running  = true;
    upNextEl.textContent = saved.upNext ? "Up Next: " + saved.upNext : "";
    subEl.textContent = "Remaining";
    overlay.classList.add("show");
    paint();
    startTick();
  })();

  closeBtn.addEventListener("click", hardClose);
})();

render();
</script>
</body>
</html>
