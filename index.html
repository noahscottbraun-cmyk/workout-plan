<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PPL · HIT</title>
<style>
  :root {
    --bg: #000000;
    --surface: #1a1a1c;
    --surface-2: #242427;
    --separator: #2e2e31;
    --text: #f2f2f2;
    --text-dim: #8a8a8e;
    --text-faint: #5c5c60;
    --accent: #a6ff00;
    --accent-dim: rgba(166, 255, 0, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --tap: 44px;
    font-size: 17px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: contain;
  }

  body {
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  /* ---------- Sticky header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    border-bottom: 0.5px solid var(--separator);
  }

  .titlebar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .titlebar h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .titlebar .sub {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  /* ---------- Segmented control (Apple style) ---------- */
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 2px;
    position: relative;
  }

  .segmented button {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 9px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease;
    min-height: 36px;
  }

  .segmented button.active {
    background: var(--accent);
    color: #0a0a0a;
    box-shadow: 0 1px 6px rgba(166, 255, 0, 0.25);
  }

  /* ---------- Progress ---------- */
  .progress-wrap {
    padding: 12px 0 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* ---------- Content ---------- */
  main { padding: 8px 16px 0; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 26px 4px 10px;
  }

  .section-label:first-child { margin-top: 16px; }

  .block-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    padding: 14px 16px 4px;
    text-transform: none;
  }

  /* ---------- Agenda rows / cards ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--separator);
  }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 15px 16px;
    min-height: var(--tap);
    cursor: pointer;
    user-select: none;
  }

  .row + .row { border-top: 0.5px solid var(--separator); }

  /* ---------- Checkbox ---------- */
  .check {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .check svg {
    width: 14px;
    height: 14px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .row.checked .check,
  .set-row.checked .check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .row.checked .check svg,
  .set-row.checked .check svg { opacity: 1; transform: scale(1); }
  .row:active .check, .set-row:active .check { transform: scale(0.88); }

  /* ---------- Row text ---------- */
  .row-body { flex: 1; min-width: 0; }

  .row-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    transition: color 0.2s ease;
  }

  .row.checked .row-title {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    white-space: nowrap;
  }

  .badge.iso {
    background: var(--surface-2);
    color: var(--text-dim);
  }

  .row.checked .badge { opacity: 0.4; }

  .row-dur {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }
  .row.checked .row-dur { color: var(--text-faint); }

  .meta {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  .meta .rest { color: var(--text-dim); font-weight: 500; }
  .row.checked .meta { color: var(--text-faint); }

  .note {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-dim);
  }

  .row.checked .note { opacity: 0.45; }

  /* Multi-set: stack the title row, then the set checkboxes */
  .exercise { padding: 15px 16px; }
  .exercise + .exercise { border-top: 0.5px solid var(--separator); }

  .ex-head { margin-bottom: 12px; }

  .sets {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    cursor: pointer;
    user-select: none;
    min-height: 40px;
  }
  .set-row + .set-row { border-top: 0.5px solid var(--separator); }
  .row + .set-row { border-top: 0.5px solid var(--separator); }
  .card > .set-row { padding-left: 16px; padding-right: 16px; }

  .set-row .check { width: 23px; height: 23px; margin-top: 0; }
  .set-row .check svg { width: 12px; height: 12px; }

  .set-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .set-row.checked .set-label {
    color: var(--text-faint);
    text-decoration: line-through;
  }
  .set-reps {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .set-row.checked .set-reps { color: var(--text-faint); }

  /* ---------- Reset ---------- */
  .reset-wrap { padding: 32px 16px 8px; text-align: center; }
  .reset {
    appearance: none;
    border: 0.5px solid var(--separator);
    background: var(--surface);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .reset:active { background: var(--surface-2); }
  .reset.armed { color: #ff453a; border-color: #ff453a; }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 14px 24px 0;
    line-height: 1.5;
  }

  /* ---------- Done banner ---------- */
  .done-banner {
    margin: 18px 16px 0;
    padding: 16px;
    border-radius: var(--radius);
    background: var(--accent-dim);
    border: 0.5px solid rgba(166, 255, 0, 0.3);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.01em;
    display: none;
  }
  .done-banner.show { display: block; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease; }

  /* ---------- Rest Timer Modal ---------- */
  .timer-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .timer-overlay.show { display: flex; }

  .timer-modal {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 0.5px solid var(--separator);
    border-radius: 28px;
    padding: 22px 22px 24px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }

  .timer-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }
  .timer-close svg { width: 13px; height: 13px; }

  .timer-exname {
    display: none;
  }

  .up-next {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
    margin-top: 22px;
    min-height: 18px;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 4px;
  }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: var(--surface-2); }
  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.95s linear;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .ring-time {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }
  .ring-sub {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

</style>
</head>
<body>
  <header>
    <div class="segmented" role="tablist">
      <button data-day="push" class="active" role="tab">Push</button>
      <button data-day="pull" role="tab">Pull</button>
      <button data-day="legs" role="tab">Legs</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    </div>
  </header>

  <div class="done-banner" id="doneBanner">Workout complete. Great work!</div>

  <main id="agenda"></main>

  <div class="reset-wrap">
    <button class="reset" id="resetBtn">Reset this day</button>
  </div>

  <div class="timer-overlay" id="timerOverlay">
    <div class="timer-modal">
      <button class="timer-close" id="timerClose" aria-label="Close timer">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>

      <div class="ring-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="100" stroke-width="14"></circle>
          <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100" stroke-width="14"
            stroke-dasharray="628.3" stroke-dashoffset="628.3"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-time" id="ringTime">0:00</div>
          <div class="ring-sub" id="ringSub">Rest</div>
        </div>
      </div>

      <div class="up-next" id="upNext"></div>
    </div>
  </div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0a0a0a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const PLAN = {
  push: {
    title: "Push",
    warmup: "Light dynamic movement — arm swings and shoulder circles to raise core temperature.",
    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first press. These don't count as working sets.",
    exercises: [
      { name: "Chest Press", variant: "Machine or Barbell Bench", type: "compound", block: "Press station", sets: 3, reps: "8–12", rest: "75s", note: "Lower under control to mid-chest. Keep shoulder blades pulled back and down. Drive up without bouncing. Stop 1 rep shy on sets 1–2, true failure on the last set." },
      { name: "Incline Dumbbell Press", type: "compound", block: "Press station", sets: 3, reps: "8–12", rest: "60s", note: "Set the bench around 30°. Lower until you feel a stretch across the upper chest. Press the dumbbells up and slightly together. Failure on the last set; down-set if reps drop below range." },
      { name: "Overhead Press", variant: "Machine or Dumbbell", type: "compound", block: "Press station", sets: 3, reps: "8–12", rest: "60s", note: "Brace your core and squeeze your glutes — don't lean back. Press straight overhead, not forward. Full lockout at the top. Failure on the last set." },
      { name: "Pec Deck or Cable Fly", type: "iso", block: "Pec deck", sets: 2, reps: "12–15", rest: "60s", note: "Keep a slight bend in the elbows throughout. Lead with the elbows, not the hands. Squeeze hard at the midline, control the stretch back. Take both sets to failure." },
      { name: "Cable Lateral Raise", type: "iso", block: "Cable station", sets: 3, reps: "12–20", rest: "45s", note: "Lead with the elbow, raise to shoulder height. Keep a soft elbow and no swinging or body english. Lower slowly. Failure on every set." },
      { name: "Triceps Pushdown", type: "iso", block: "Cable station", sets: 3, reps: "10–15", rest: "45s", note: "Pin your elbows to your sides and keep them there. Fully extend at the bottom, control the return. Failure on every set." },
      { name: "Overhead Cable Extension", type: "iso", block: "Cable station", sets: 2, reps: "10–15", rest: "45s", note: "Let the elbows travel behind your head for a deep stretch. Keep upper arms fixed, extend fully. Failure on both sets." }
    ]
  },
  pull: {
    title: "Pull",
    warmup: "Light dynamic movement — arm swings, scapular pull-ups.",
    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first pull. These don't count as working sets.",
    exercises: [
      { name: "Lat Pulldown or Pull-Up", type: "compound", block: "Pulldown / row station", sets: 3, reps: "8–12", rest: "75s", note: "Start from a full stretch overhead. Drive your elbows down and back, not your hands. Pull to the upper chest and control the return. Stop 1 rep shy on sets 1–2, failure on the last." },
      { name: "Seated Cable Row", type: "compound", block: "Pulldown / row station", sets: 3, reps: "8–12", rest: "60s", note: "Keep your torso upright — don't rock for momentum. Pull to your stomach, squeeze the shoulder blades together. Control the stretch forward. Failure on the last set." },
      { name: "Chest-Supported Row", variant: "or Barbell Row", type: "compound", block: "Supported row", sets: 3, reps: "10–12", rest: "60s", note: "Let the weight stretch your back at the bottom. Row toward your hips, leading with the elbows. Pause and squeeze at the top. Stop 1 rep shy early, failure on the last set." },
      { name: "Face Pull or Reverse Pec Deck", type: "iso", block: "Rear delts + biceps", sets: 3, reps: "15–20", rest: "45s", note: "Keep it light and controlled. Pull toward your forehead with elbows high. Squeeze the rear delts, don't shrug. Failure on every set." },
      { name: "EZ-Bar or Cable Curl", type: "iso", block: "Rear delts + biceps", sets: 3, reps: "10–12", rest: "45s", note: "Keep your elbows pinned at your sides. Curl without swinging your back. Full squeeze at the top, controlled lowering. Failure on every set." },
      { name: "Incline Dumbbell Curl", type: "iso", block: "Rear delts + biceps", sets: 3, reps: "10–12", rest: "45s", note: "Let your arms hang fully behind your torso for the stretch. Curl without letting the elbows drift forward. Failure on every set." }
    ]
  },
  legs: {
    title: "Legs",
    warmup: "Light dynamic movement — leg swings, bodyweight squats.",
    rampup: "2 ramp-up sets (≈50%, ≈75% of working weight) before your first squat. These don't count as working sets.",
    exercises: [
      { name: "Squat or Hack Squat", type: "compound", block: "Rack / free-weight zone", sets: 3, reps: "8–12", rest: "90s", note: "Brace your core and keep your chest up. Push your knees out, descend to at least parallel. Drive through mid-foot. Stay 1–2 reps shy — never to true failure under load. Use the rack safeties." },
      { name: "Romanian Deadlift", type: "compound", block: "Rack / free-weight zone", sets: 3, reps: "10–12", rest: "75s", note: "Soft knees, push your hips back. Keep a flat back and the bar close to your legs. Feel the hamstring stretch, then drive your hips forward. Stay 1–2 reps shy; stop if your back rounds." },
      { name: "Leg Press", type: "compound", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Feet mid-platform, knees tracking over your toes. Lower until your knees reach ~90° without your lower back rounding. Don't lock out hard at the top. Failure on the last set." },
      { name: "Leg Extension", type: "iso", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Pause and squeeze the quads at the top. Lower under control, don't let it slam. Failure on every set; down-set as you fatigue." },
      { name: "Seated or Lying Leg Curl", type: "iso", block: "Machine zone", sets: 3, reps: "12–15", rest: "60s", note: "Keep your hips down on the pad. Curl all the way, squeeze at the bottom. Control the negative — don't let it snap back. Failure on every set." },
      { name: "Calf Raise", variant: "Machine or Standing", type: "iso", block: "Machine zone", sets: 3, reps: "15–20", rest: "45s", note: "Drop into a deep stretch at the bottom, pause briefly. Rise to full extension on the toes. No bouncing through the reps. Failure on every set." }
    ]
  }
};

const STORAGE_KEY = "ppl-hit-v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { state = {}; }

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let currentDay = "push";

function itemKey(day, id) { return day + ":" + id; }
function isChecked(day, id) { return !!state[itemKey(day, id)]; }
function setChecked(day, id, val) {
  state[itemKey(day, id)] = val;
  if (!val) delete state[itemKey(day, id)];
  save();
}

function buildIds(day) {
  // Returns a flat list of every checkable id for the day (for progress)
  const ids = ["warmup_dynamic", "warmup_ramp1", "warmup_ramp2"];
  PLAN[day].exercises.forEach((ex, i) => {
    const lastEx = PLAN[day].exercises.length - 1;
    for (let s = 1; s <= ex.sets; s++) {
      ids.push("ex" + i + "_set" + s);
      const finalRestOfDay = (i === lastEx) && (s === ex.sets);
      if (!finalRestOfDay) ids.push("ex" + i + "_rest" + s);
    }
  });
  ids.push("cooldown");
  return ids;
}

function checkSvgEl() {
  const span = document.createElement("span");
  span.className = "check";
  span.innerHTML = CHECK_SVG;
  return span;
}

function makeSimpleRow(day, id, title, duration, note) {
  const row = document.createElement("div");
  row.className = "row" + (isChecked(day, id) ? " checked" : "");
  row.appendChild(checkSvgEl());
  const body = document.createElement("div");
  body.className = "row-body";
  const t = document.createElement("div");
  t.className = "row-title";
  t.appendChild(document.createTextNode(title));
  if (duration) {
    const d = document.createElement("span");
    d.className = "row-dur";
    d.textContent = duration;
    t.appendChild(d);
  }
  body.appendChild(t);
  if (note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; body.appendChild(n); }
  row.appendChild(body);
  row.addEventListener("click", () => {
    const now = !isChecked(day, id);
    setChecked(day, id, now);
    row.classList.toggle("checked", now);
    const c = row.querySelector(".check");
    if (now) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    updateProgress();
  });
  return row;
}

function makeSetRow(day, id, label, right, restSpec) {
  const sr = document.createElement("div");
  sr.className = "set-row" + (isChecked(day, id) ? " checked" : "");
  sr.appendChild(checkSvgEl());
  const lab = document.createElement("span");
  lab.className = "set-label";
  lab.textContent = label;
  sr.appendChild(lab);
  const r = document.createElement("span");
  r.className = "set-reps";
  r.textContent = right;
  sr.appendChild(r);
  sr.addEventListener("click", () => {
    const now = !isChecked(day, id);
    setChecked(day, id, now);
    sr.classList.toggle("checked", now);
    const c = sr.querySelector(".check");
    if (now) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }
    updateProgress();
    if (now && restSpec && window.openTimer) window.openTimer(restSpec);
  });
  return sr;
}

// Parse a rest string like "45s", "60–75s", "75–90s" into {low, high} seconds
function parseRest(restStr) {
  const nums = (restStr.match(/\d+/g) || []).map(Number);
  if (nums.length === 0) return { low: 60, high: 60 };
  if (nums.length === 1) return { low: nums[0], high: nums[0] };
  return { low: nums[0], high: nums[1] };
}

function render() {
  const day = currentDay;
  const plan = PLAN[day];
  const main = document.getElementById("agenda");
  main.innerHTML = "";

  // WARM-UP
  const wlabel = document.createElement("div");
  wlabel.className = "section-label";
  wlabel.textContent = "Warm-up";
  main.appendChild(wlabel);
  const wcard = document.createElement("div");
  wcard.className = "card";
  wcard.appendChild(makeSimpleRow(day, "warmup_dynamic", "Dynamic Warm-Up", "2 min", plan.warmup));
  wcard.appendChild(makeSetRow(day, "warmup_ramp1", "Ramp-Up Set 1", "≈50%"));
  wcard.appendChild(makeSetRow(day, "warmup_ramp2", "Ramp-Up Set 2", "≈75%"));
  main.appendChild(wcard);

  // EXERCISES
  const elabel = document.createElement("div");
  elabel.className = "section-label";
  elabel.textContent = "Lifts";
  main.appendChild(elabel);
  const ecard = document.createElement("div");
  ecard.className = "card";

  let lastBlock = null;
  plan.exercises.forEach((ex, i) => {
    if (ex.block && ex.block !== lastBlock) {
      const bl = document.createElement("div");
      bl.className = "block-label";
      bl.textContent = ex.block;
      ecard.appendChild(bl);
      lastBlock = ex.block;
    }
    const block = document.createElement("div");
    block.className = "exercise";

    const head = document.createElement("div");
    head.className = "ex-head";
    const t = document.createElement("div");
    t.className = "row-title";
    t.appendChild(document.createTextNode(ex.name));
    const badge = document.createElement("span");
    badge.className = "badge" + (ex.type === "iso" ? " iso" : "");
    badge.textContent = ex.type === "iso" ? "Isolation" : "Compound";
    t.appendChild(badge);
    head.appendChild(t);

    const meta = document.createElement("div");
    meta.className = "meta";
    const variant = ex.variant ? ex.variant + " · " : "";
    meta.innerHTML = variant + ex.sets + (ex.sets > 1 ? " sets" : " set") + " × " + ex.reps + " reps";
    head.appendChild(meta);

    const note = document.createElement("div");
    note.className = "note";
    note.textContent = ex.note;
    head.appendChild(note);

    block.appendChild(head);

    const sets = document.createElement("div");
    sets.className = "sets";
    const lastEx = plan.exercises.length - 1;
    for (let s = 1; s <= ex.sets; s++) {
      sets.appendChild(makeSetRow(day, "ex" + i + "_set" + s, "Set " + s, ex.reps + " reps"));
      const finalRestOfDay = (i === lastEx) && (s === ex.sets);
      if (!finalRestOfDay) {
        let nextReps, nextName;
        if (s < ex.sets) { nextReps = ex.reps; nextName = ex.name; }
        else { const nx = plan.exercises[i + 1]; nextReps = nx.reps; nextName = nx.name; }
        const upNext = nextReps + " Reps of " + nextName;
        sets.appendChild(makeSetRow(day, "ex" + i + "_rest" + s, "Rest", ex.rest, { upNext: upNext, rest: ex.rest }));
      }
    }
    block.appendChild(sets);
    ecard.appendChild(block);
  });
  main.appendChild(ecard);

  // COOLDOWN
  const clabel = document.createElement("div");
  clabel.className = "section-label";
  clabel.textContent = "Cooldown";
  main.appendChild(clabel);
  const ccard = document.createElement("div");
  ccard.className = "card";
  ccard.appendChild(makeSimpleRow(day, "cooldown", "Cooldown stretch", "8 min", "Static stretches for the muscles you trained. Slow it down and breathe."));
  main.appendChild(ccard);

  updateProgress();
}

function updateProgress() {
  const ids = buildIds(currentDay);
  const total = ids.length;
  const done = ids.filter(id => isChecked(currentDay, id)).length;
  document.getElementById("progFill").style.width = (total ? (done / total * 100) : 0) + "%";
  document.getElementById("doneBanner").classList.toggle("show", done === total && total > 0);
}

// Tabs
document.querySelectorAll(".segmented button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".segmented button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDay = btn.dataset.day;
    if (typeof disarmReset === "function") disarmReset();
    render();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  });
});

// Reset
// Reset (two-tap confirm — works inside sandboxed iframes where confirm() is blocked)
const resetBtn = document.getElementById("resetBtn");
let resetArmed = false;
let resetTimer = null;
function disarmReset() {
  resetArmed = false;
  resetBtn.textContent = "Reset this day";
  resetBtn.classList.remove("armed");
  if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
}
resetBtn.addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true;
    resetBtn.textContent = "Delete all progress";
    resetBtn.classList.add("armed");
    resetTimer = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  buildIds(currentDay).forEach(id => setChecked(currentDay, id, false));
  render();
});

/* ---------------- Rest Timer ---------------- */
(function () {
  const overlay = document.getElementById("timerOverlay");
  const closeBtn = document.getElementById("timerClose");
  const ringFg = document.getElementById("ringFg");
  const ringTime = document.getElementById("ringTime");
  const ringSub = document.getElementById("ringSub");
  const upNextEl = document.getElementById("upNext");

  const CIRC = 2 * Math.PI * 100; // r=100
  ringFg.setAttribute("stroke-dasharray", CIRC.toFixed(1));
  ringFg.setAttribute("stroke-dashoffset", CIRC.toFixed(1));

  let totalSec = 0;
  let remaining = 0;
  let intervalId = null;
  let running = false;

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function setRing(fraction) {
    const offset = CIRC * (1 - fraction);
    ringFg.setAttribute("stroke-dashoffset", offset.toFixed(2));
  }
  function stopTick() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
  }
  function startTick() {
    stopTick();
    intervalId = setInterval(tick, 1000);
  }
  function tick() {
    if (!running) return;
    remaining -= 1;
    if (remaining <= 0) {
      remaining = 0;
      ringTime.textContent = "0:00";
      setRing(1);
      ringSub.textContent = "Done";
      stopTick();
      running = false;
      if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
      setTimeout(() => { if (ringSub.textContent === "Done") closeTimer(); }, 1400);
      return;
    }
    ringTime.textContent = fmt(remaining);
    setRing((totalSec - remaining) / totalSec);
  }
  function closeTimer() {
    stopTick();
    running = false;
    overlay.classList.remove("show");
  }

  // Opens the modal and immediately starts counting down.
  function openTimer(spec) {
    const secs = parseRest(spec.rest).low; // single value now
    totalSec = secs;
    remaining = secs;
    upNextEl.textContent = spec.upNext ? "Up Next: " + spec.upNext : "";
    setRing(0);
    ringTime.textContent = fmt(remaining);
    ringSub.textContent = "Remaining";
    running = true;
    overlay.classList.add("show");
    startTick();
  }
  window.openTimer = openTimer;

  closeBtn.addEventListener("click", closeTimer);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeTimer(); });
})();

render();
</script>
